  let g="";for(let x=0;x<=W;x+=32)g+=`<line class="g" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;for(let y=0;y<=H;y+=32)g+=`<line class="g" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  const pins=pt.map((q,i)=>`<g transform="translate(${q[0].toFixed(1)},${q[1].toFixed(1)})"><path class="pn" d="M0,0 C-9,-10 -11,-14 -11,-19 A11,11 0 1 1 11,-19 C11,-14 9,-10 0,0Z"/><text class="nm" y="-15">${i+1}</text></g>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="路線預覽">${g}<polyline class="ln" points="${pt.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ")}"/>${pins}</svg>`;
}
function parseCoord(s){
  s=(s||"").trim();if(!s)return null;
  const m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  return m?{lat:+m[1],lng:+m[2]}:null;
}
// ---- UI ----
function applyUI(){
  const r=document.documentElement;
  r.style.setProperty("--ff",FONTS[U.font]||FONTS.sans);r.style.setProperty("--fs",SIZES[U.size]||"15px");r.style.setProperty("--r",RAD[U.radius]||"14px");r.style.setProperty("--gl",GL[U.glow]||"14%");
  U.acc?r.style.setProperty("--acc",U.acc):r.style.removeProperty("--acc");
  U.style!="classic"?r.setAttribute("data-style",U.style):r.removeAttribute("data-style");
  U.style=="classic"&&U.theme!="auto"?r.setAttribute("data-theme",U.theme):r.removeAttribute("data-theme");
  r.setAttribute("data-card",U.card);
}
function panel(){
  const b=(k,v,l)=>`<button class="chip ${U[k]==v?"on":""}" data-u="${k}=${v}">${l}</button>`;
  return `<div class="card" style="color:var(--ink)"><h2>⚙ 外觀設定</h2>
  <div class="set"><span>風格</span>${PRE.map(p=>b("style",p[0],p[1])).join("")}</div>
  ${U.style=="cyber"?`<div class="set"><span>霓虹</span>${b("glow","0","關")}${b("glow","1","低")}${b("glow","2","中")}</div>`:""}
  <div class="set"><span>圓角</span>${b("radius","s","方正")}${b("radius","m","適中")}${b("radius","l","圓潤")}</div>
  <div class="set"><span>卡片</span>${b("card","line","線框")}${b("card","shadow","陰影")}${b("card","flat","無框")}</div>
  <div class="set"><span>字型</span>${b("font","sans","黑體")}${b("font","serif","明體")}${b("font","round","圓體")}${b("font","mono","等寬")}</div>
  <div class="set"><span>字級</span>${b("size","s","小")}${b("size","m","中")}${b("size","l","大")}</div>
  ${U.style=="classic"?`<div class="set"><span>明暗</span>${b("theme","auto","跟隨系統")}${b("theme","light","淺色")}${b("theme","dark","深色")}</div>`:""}
  <div class="set"><span>主色</span>${b("acc","","風格預設")}${ACC.map(c=>`<button class="sw ${U.acc==c?"on":""}" style="background:${c}" data-u="acc=${c}" aria-label="${c}"></button>`).join("")}</div>
  <div class="note">外觀只存在你自己的裝置，不會影響旅伴。</div></div>`;
}
function hotelsToday(i){
  const y=ymd(D(i)),hs=S.hotels.filter(h=>h.ci<=y&&y<=h.co);if(!hs.length)return "";
  return `<div class="card"><h2>🏨 住宿</h2>`+hs.map(h=>`<div class="stop"><div class="grow"><a href="${mapQ(h.addr||h.name)}" target="_blank" rel="noopener">${esc(h.name)}</a>${h.addr?`<div class="note">${esc(h.addr)}</div>`:""}<div class="note">${h.ci==y?`入住 ${h.cit||""}　`:""}${h.co==y?`退房 ${h.cot||""}`:""}${h.ci!=y&&h.co!=y?"連住中":""}</div></div></div>`).join("")+`</div>`;
}
function overview(){
  const dt=allTot(),ht=hotelTot(),ft=flightTot(),g=dt+ht+ft,tb=S.tb||0;
  let h=`<div class="card"><h2>💰 費用總覽</h2><div class="ov"><span>每日花費</span><span>${yen(dt)}</span><span>住宿</span><span>${yen(ht)}</span><span>機票</span><span>${yen(ft)}</span></div>
  <div class="tot"><span>全程總花費</span><span>${yen(g)}　≈ ${twd(g)}</span></div>
  <div class="row"><span class="note" style="align-self:center;min-width:64px">機票費用</span><input id="f_a" type="number" inputmode="decimal" placeholder="金額" value="${S.flight&&S.flight.amt?S.flight.amt:""}">${curSel("f_c",S.flight&&S.flight.cur)}</div>
  <div class="row"><span class="note" style="align-self:center;min-width:64px">總預算</span><input id="tb" type="number" inputmode="decimal" placeholder="日圓（選填）" value="${tb||""}"></div>`;
  if(tb>0){const left=tb-dt;h+=`<div class="tot" style="border:0;margin:6px 0 0"><span>總預算 ${yen(tb)}</span><span class="${left<0?"over":""}">${left<0?"超支 "+yen(-left):"剩餘 "+yen(left)}</span></div><div class="bar"><i style="width:${Math.min(100,dt/tb*100)}%;${left<0?"background:#ff5a6e":""}"></i></div><div class="note">只計每日花費，不含住宿與機票。</div>`}
  h+=`<div class="row"><span class="note" style="align-self:center;min-width:64px">匯率</span><input id="rate" type="number" step="0.001" value="${S.rate}" style="max-width:100px"><span class="note" style="align-self:center">1 日圓 ≈ 台幣</span></div></div>`;
  h+=`<div class="card"><h2>🏨 住宿</h2>`+(S.hotels.length?S.hotels.map((x,k)=>`<div class="stop"><div class="grow"><a href="${mapQ(x.addr||x.name)}" target="_blank" rel="noopener">${esc(x.name)}</a>${x.cost?`<span class="tag">${fmt(x.cost,x.cur)}</span>`:""}${x.addr?`<div class="note">${esc(x.addr)}</div>`:""}<div class="note">入住 ${md(x.ci)} ${x.cit||""} → 退房 ${md(x.co)} ${x.cot||""}</div></div><button class="x" style="top:0" data-dh="${k}" aria-label="刪除">×</button></div>`).join(""):`<div class="empty">還沒有住宿資料。</div>`)+
  `<div class="row"><input id="h_n" class="w" placeholder="飯店名稱"><input id="h_a" class="w" placeholder="地址"></div>
  <div class="row"><input id="h_ci" type="date" value="2026-11-11"><input id="h_cit" type="time" value="15:00"><input id="h_co" type="date" value="2026-11-19"><input id="h_cot" type="time" value="11:00"></div>
  <div class="row"><input id="h_p" type="number" inputmode="decimal" placeholder="住宿總費用（選填）">${curSel("h_c","TWD")}<button class="b" id="addH">新增</button></div></div>`;
  h+=`<div class="card"><h2>📅 每日行程・預算・花費</h2>`+[...Array(9).keys()].map(i=>{const d=D(i),it=dayItems(i),s=stats(it);
    return `<div class="stop"><div class="grow"><a href="#d${i+1}" data-go="${i}">Day ${i+1}　${d.getMonth()+1}/${d.getDate()}</a><div class="note">${day(i).stops.length||it.length>0&&i%8==0?`${s.n} 個行程${s.m>1?` · 約 ${s.km.toFixed(1)} km`:""}`:"尚未安排"}</div></div><div style="text-align:right"><div style="font-family:var(--fm)">${yen(dayTot(i))}</div><input class="bi" data-b="${i}" type="number" inputmode="decimal" placeholder="預算" value="${day(i).budget||""}" style="width:92px;margin-top:4px"></div></div>`}).join("")+`</div>`;
  const cs=byCat(allExp());
  h+=`<div class="card"><h2>📊 每日花費分類統計</h2>`+(cs.length?cs.map(([c,v])=>`<div class="tot" style="border:0;margin:0;padding:0;font-weight:400"><span>${c}</span><span>${yen(v)}　${Math.round(v/dt*100)}%</span></div><div class="bar"><i style="width:${v/dt*100}%"></i></div>`).join(""):`<div class="empty">記帳後會在這裡顯示統計。</div>`)+`</div>`;
  return h;
}
function timeline(items){
  if(!items.length)return `<div class="empty">還沒有行程，按右下角 ＋ 新增。</div>`;
  let h=`<div class="tl">`,prev=null;
  items.forEach(x=>{
    if(x.lat!=null&&prev)h+=`<div class="leg">↓ 距上一站約 ${hv(prev,x).toFixed(1)} km</div>`;
    if(x.lat!=null)prev=x;
    const hh=x.t?+x.t.slice(0,2):null;
    const title=x.lat!=null||x.fixed?esc(x.name):esc(x.name);
    const cat=x.fixed?`<div class="cat">${EMO[x.cat]} ${x.cat}</div>`:`<select class="cs" data-cs="${x.ref}" aria-label="類別">${SC.map(c=>`<option value="${c}" ${c==x.cat?"selected":""}>${EMO[c]} ${c}</option>`).join("")}</select>`;
    h+=`<div class="ti"><div class="tc"><div class="tb"><div class="tbox"><small>${hh==null?"時間未定":hh<12?"上午":"下午"}</small><b>${x.t||"--:--"}</b></div>${cat}</div>
    <div class="tx"><div class="ttl">${x.fixed?title:`<a href="${mapQ(x.lat!=null?x.lat+","+x.lng:x.name+" 東京")}" target="_blank" rel="noopener">${title}</a>`}</div>
    <div class="pin">📍 ${esc(x.area||(x.lat!=null?x.lat.toFixed(4)+", "+x.lng.toFixed(4):"未定位（不計入距離）"))}</div>${x.note?`<div class="nt">ⓘ ${esc(x.note)}</div>`:""}
    ${x.fixed?"":`<button class="x" data-ds="${x.ref}" aria-label="刪除">×</button>`}</div></div></div>`;
  });
  return h+`</div>`;
}
function render(){
  document.getElementById("set").innerHTML=U.open?panel():"";
  document.getElementById("seg").innerHTML=`<button class="${cur>=0?"on":""}" data-go="${last}" aria-label="行程">📅</button><button class="${cur<0?"on":""}" data-go="-1" aria-label="費用總覽">＄</button><button class="${U.open?"on":""}" data-u="open=toggle" aria-label="外觀">⚙</button>`;
  const cb=document.getElementById("chips");
  cb.innerHTML=[...Array(9).keys()].map(i=>{const d=D(i);return `<button class="dc ${cur==i?"on":""}" data-go="${i}"><small>${d.getMonth()+1}/${d.getDate()}</small><b>D${i+1}</b></button>`}).join("");
  const on=cb.querySelector(".dc.on");if(on)cb.scrollLeft=on.offsetLeft-cb.clientWidth/2+on.clientWidth/2;
  document.getElementById("fab").style.display=cur<0?"none":"block";
  const v=document.getElementById("view");
  if(cur<0){v.innerHTML=overview();return}
  const dd=day(cur),d=D(cur),tot=dayTot(cur),items=dayItems(cur),s=stats(items),ru=routeUrl(items);
  let h=`<h2 class="dh">Day ${cur+1}　${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）</h2>`;
  h+=`<div class="card"><div class="kpi"><div><b>${s.n}</b><span>個行程</span></div><div><b>${s.m}</b><span>已定位</span></div><div><b>${s.km.toFixed(1)}</b><span>km（直線）</span></div></div>`+
    (ru?`<a class="pv" href="${ru}" target="_blank" rel="noopener">${preview(items)}</a><a class="b" href="${ru}" target="_blank" rel="noopener">在 Google 地圖開啟路線</a>`:`<div class="pv">${preview(items)}</div>`)+
    `<div class="note" style="margin-top:6px">示意圖依座標等比例繪製，距離為直線估算；實際路程請以 Google 地圖為準。</div></div>`;
  h+=hotelsToday(cur)+timeline(items);
  h+=`<div class="card" id="addcard"><h2>＋ 新增行程</h2>
   <div class="row"><input id="st_n" class="w" list="spots" placeholder="地點（可從清單選，或自己輸入）"></div>
   <div class="row"><input id="st_t" type="time"><select id="st_c">${SC.map(c=>`<option value="${c}">${EMO[c]} ${c}</option>`).join("")}</select></div>
   <div class="row"><input id="st_o" class="w" placeholder="備註（選填）"></div>
   <div class="row"><input id="st_g" class="w" placeholder="座標或 Google 地圖網址（清單外的地點選填）"><button class="b" id="addS">新增</button></div></div>`;
  let bud="";
  if(dd.budget>0){const left=dd.budget-tot;bud=`<div class="tot" style="border:0;margin:0"><span>今日預算 ${yen(dd.budget)}</span><span class="${left<0?"over":""}">${left<0?"超支 "+yen(-left):"剩餘 "+yen(left)}</span></div><div class="bar"><i style="width:${Math.min(100,tot/dd.budget*100)}%;${left<0?"background:#ff5a6e":""}"></i></div>`}
  h+=`<div class="card"><h2>💴 今日花費</h2>${bud}`+
   (dd.exp.length?dd.exp.map((e,k)=>`<div class="stop"><div class="grow">${esc(e.label)}<span class="tag">${CATS.includes(e.cat)?e.cat:"其他"}</span></div><div style="font-family:var(--fm)">${yen(e.amt)}</div><button class="x" style="position:static" data-de="${k}" aria-label="刪除">×</button></div>`).join(""):`<div class="empty">還沒有記錄。</div>`)+
   `<div class="row"><select id="ex_c">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="ex_l" class="w" placeholder="項目（例：午餐拉麵）"><input id="ex_a" type="number" inputmode="decimal" placeholder="日圓"><button class="b" id="addE">記帳</button></div>
   <div class="tot"><span>今日合計</span><span>${yen(tot)}　≈ ${twd(tot)}</span></div>`+
   (dd.exp.length?`<div class="note" style="margin-top:4px">${byCat(dd.exp).map(([c,x])=>c+" "+yen(x)).join("　")}</div>`:"")+`</div>`;
  v.innerHTML=h;
}
function go(i){cur=i;if(i>=0)last=i;location.hash=i<0?"":"d"+(i+1);render();scrollTo(0,0)}
const val=id=>document.getElementById(id).value;
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-u],[data-ds],[data-de],[data-dh],#addS,#addE,#addH,#fab");if(!t)return;
  if(t.id=="fab"){const c=document.getElementById("addcard");if(c){c.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>document.getElementById("st_n").focus({preventScroll:true}),350)}return}
  if(t.dataset.go!==undefined){e.preventDefault();return go(+t.dataset.go)}
  if(t.dataset.u!==undefined){const i=t.dataset.u.indexOf("="),k=t.dataset.u.slice(0,i),v=t.dataset.u.slice(i+1);if(k=="open")U.open=U.open?0:1;else U[k]=v;try{localStorage.setItem("tokyoUI2",JSON.stringify(U))}catch(x){}applyUI();return render()}
  const dd=day(Math.max(cur,0));
  if(t.dataset.ds!==undefined)dd.stops.splice(+t.dataset.ds,1);
  else if(t.dataset.de!==undefined)dd.exp.splice(+t.dataset.de,1);
  else if(t.dataset.dh!==undefined)S.hotels.splice(+t.dataset.dh,1);
  else if(t.id=="addS"){const n=val("st_n").trim();if(!n)return;
    const sp=SP.find(x=>x.name.toLowerCase()==n.toLowerCase()),g=parseCoord(val("st_g"))||sp,c=val("st_c");
    const o={t:val("st_t"),name:n,note:val("st_o").trim(),cat:c=="景點"&&sp?sp.cat:c};
    if(g){o.lat=g.lat;o.lng=g.lng}if(sp)o.area=sp.area;
    dd.stops.push(o)}
  else if(t.id=="addE"){const a=parseFloat(val("ex_a"));if(!(a>=0))return;
    dd.exp.push({cat:val("ex_c"),label:val("ex_l").trim()||val("ex_c"),amt:a})}
  else if(t.id=="addH"){const n=val("h_n").trim();if(!n||!val("h_ci")||!val("h_co"))return;
    S.hotels.push({name:n,addr:val("h_a").trim(),ci:val("h_ci"),cit:val("h_cit"),co:val("h_co"),cot:val("h_cot"),cost:parseFloat(val("h_p"))||0,cur:val("h_c")});
    S.hotels.sort((a,b)=>a.ci.localeCompare(b.ci))}
  save();render();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id=="rate")S.rate=parseFloat(t.value)||0.21;
  else if(t.id=="tb"){const b=parseFloat(t.value);if(b>0)S.tb=b;else delete S.tb}
  else if(t.id=="f_a"||t.id=="f_c")S.flight={amt:parseFloat(val("f_a"))||0,cur:val("f_c")};
  else if(t.dataset.b!==undefined){const b=parseFloat(t.value),d=day(+t.dataset.b);if(b>0)d.budget=b;else delete d.budget}
  else if(t.dataset.cs!==undefined){day(cur).stops[+t.dataset.cs].cat=t.value}
  else return;
  save();render();
});
function norm(o){return Object.assign({rate:0.21,hotels:[],days:{}},o)}
function countdown(){
  const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),k=Math.round((t0-START)/864e5);
  document.getElementById("cd").textContent=k<0?`距出發還有 ${-k} 天`:k<=8?`旅途中 · Day ${k+1}`:"旅程已結束";
  return k;
}
document.getElementById("spots").innerHTML=SP.map(x=>`<option value="${esc(x.name)}">${esc(x.area)}</option>`).join("");
const h0=location.hash.match(/^#d([1-9])$/),k0=countdown();
if(h0)cur=+h0[1]-1;else if(k0>=0&&k0<=8)cur=k0;
last=Math.max(cur,0);
applyUI();render();
let local=null;try{local=JSON.parse(localStorage.getItem("tokyo")||"null")}catch(e){}
if(local){S=norm(local);render()}
save=()=>{try{localStorage.setItem("tokyo",JSON.stringify(S))}catch(e){}};
(async()=>{
  try{
    const db=await window.claude.use("db");if(!db)return;
    const ref=db.doc("trip/main");let first=true;
    ref.onSnapshot(s=>{
      const d=s.exists?s.data():null;
      if(d&&d.json){try{if(!s.metadata.hasPendingWrites){S=norm(JSON.parse(d.json));render()}}catch(e){}}
      else if(first&&local){ref.set({json:JSON.stringify(S)}).catch(()=>{})}
      first=false;
    },()=>{});
    save=()=>{try{localStorage.setItem("tokyo",JSON.stringify(S))}catch(e){}ref.set({json:JSON.stringify(S)}).catch(()=>{})};
    document.getElementById("st").textContent=" · 共用同步";
  }catch(e){}
})();
</script>
