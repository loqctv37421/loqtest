<style>

#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:60;background:#ffd43b;color:#111;border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;display:none}

@keyframes down{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

#view{transition:opacity .2s ease,transform .2s ease}
#view.out{opacity:0;transform:translateY(8px)}
.enter .dh,.enter .card,.enter .ti{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:up .35s cubic-bezier(.2,.7,.2,1) both}
.dc,.seg button,.chip,button.b,.me{transition:background .25s,color .25s,box-shadow .25s,transform .15s}

#app{opacity:0;transition:opacity .8s ease}#app.show{opacity:1}

#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 28%,#f1f1f3,#ffffff 68%);color:#111;transition:opacity .7s ease,transform .7s ease,visibility .7s}

.lg{width:100%;max-width:320px;text-align:center}
.lg>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.lg>:nth-child(2){animation-delay:.1s}.lg>:nth-child(3){animation-delay:.2s}.lg>:nth-child(4),.lg>:nth-child(5){animation-delay:.35s}

.lg button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:14px;background:#111;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.tedit{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>

const SP=SPOTS.split("\n").map(l=>{const a=l.split("|");return{name:a[0],area:a[1],lat:+a[2],lng:+a[3],cat:a[4]}});
const NRT={lat:35.7720,lng:140.3929};
let addAnim=0,READY=0,SHOWN=0,lastSync=-9,sw=0,CONF=-1,cf=0,cfgLoaded=0,RP=0;
let S={rate:0.21,hotels:[],bud:{},stops:[],exp:[],closed:{}}, cur=0,last=0,addOpen=0,PV="gmap",GB=0,FILT="all",db=null,LIVE=0,ME="local",MEM={local:{name:"我"}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const D=i=>{const d=new Date(START);d.setDate(d.getDate()+i);return d};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const md=s=>s.slice(5).replace("-","/");
const yen=n=>"¥"+Math.round(n).toLocaleString();
const twd=n=>"NT$"+Math.round(n*S.rate).toLocaleString();
const fmt=(a,c)=>c=="TWD"?"NT$"+Math.round(a).toLocaleString():yen(a);
const toJPY=(a,c)=>c=="TWD"?a/S.rate:a;
const dayExp=i=>S.exp.filter(e=>e.day==i);
const dayTot=i=>dayExp(i).reduce((a,e)=>a+e.amt,0);
const allTot=()=>S.exp.reduce((a,e)=>a+e.amt,0);
const hotelTot=()=>S.hotels.reduce((a,h)=>a+toJPY(h.cost||0,h.cur),0);
const flightTot=()=>S.flight?toJPY(S.flight.amt||0,S.flight.cur):0;
const byCat=list=>{const o={};list.forEach(e=>{const c=CATS.includes(e.cat)?e.cat:"其他";o[c]=(o[c]||0)+e.amt});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const mapQ=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const curSel=(id,v)=>`<select id="${id}"><option value="TWD" ${v!="JPY"?"selected":""}>台幣</option><option value="JPY" ${v=="JPY"?"selected":""}>日圓</option></select>`;
const nm=id=>(MEM[id]&&MEM[id].name)||"旅伴";
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const mcol=id=>MC[hash(id)%MC.length];
const memIds=()=>Object.keys(MEM).filter(k=>MEM[k].name).sort((a,b)=>nm(a).localeCompare(nm(b)));
const jst=()=>new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo"}));
const settled=i=>jst()>=new Date(2026,10,11+i,23,30);
const topSpender=i=>{const o={};dayExp(i).forEach(e=>o[e.for||e.by]=(o[e.for||e.by]||0)+e.amt);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
// ---- data layer ----
const clean=o=>JSON.parse(JSON.stringify(o));
function cfgOf(){return{rate:S.rate,tb:S.tb,flight:S.flight,hotels:S.hotels,bud:S.bud,closed:S.closed}}
function save(){
  if(LIVE){db.doc("trip/cfg").set({json:JSON.stringify(cfgOf())}).catch(()=>{})}
  else try{localStorage.setItem("tokyo",JSON.stringify(S))}catch(e){}
}
function addDoc(col,o){o.id=uid();o.by=ME;S[col].push(o);LIVE?db.collection(col).doc(o.id).set(clean(o)).catch(()=>{}):save()}
function updDoc(col,id,p){const o=S[col].find(x=>x.id==id);if(!o)return;Object.assign(o,p);LIVE?db.collection(col).doc(id).update(clean(p)).catch(()=>{}):save()}

// ---- itinerary + distance ----
function hv(a,b){const r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(x))}
function dayItems(i,all){

  const ex=dayExp(cur);
  h+=`<div class="card"><h2>💴 今日花費</h2>${bud}`+
   (ex.length?ex.map(e=>`<div class="stop"><div class="grow">${esc(e.label)}<span class="tag">${CATS.includes(e.cat)?e.cat:"其他"}</span>${e.for&&e.for!=e.by?`<span class="tag">代墊</span>`:""}${LIVE?`<div class="note" style="color:${mcol(e.by)}">● ${esc(nm(e.by))}${e.for&&e.for!=e.by?" 代 "+esc(nm(e.for))+" 墊付":""}</div>`:""}</div><div class="fm">${yen(e.amt)}</div>${e.by==ME?`<button class="x" style="position:static" data-de="${e.id}" aria-label="刪除">×</button>`:""}</div>`).join(""):`<div class="empty">還沒有記錄。</div>`)+
   `<div class="row"><select id="ex_c">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="ex_l" class="w" placeholder="項目（例：午餐拉麵）"></div>
   <div class="row">${oth.length?`<select id="ex_f"><option value="">自己的花費</option>${oth.map(id=>`<option value="${id}">代 ${esc(nm(id))} 墊付</option>`).join("")}</select>`:""}<input id="ex_a" type="number" inputmode="decimal" placeholder="日圓"><button class="b" id="addE">記帳</button></div>
   <div class="tot"><span>今日合計（全員）</span><span>${yen(tot)}　≈ ${twd(tot)}</span></div>`+
   (ex.length?`<div class="note" style="margin-top:4px">${byCat(ex).map(([c,x])=>c+" "+yen(x)).join("　")}</div>`:"")+`</div>`;
  v.innerHTML=h+foot;addAnim=0;
}
function render(){
  const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains("tedit")){RP=1;return}
  const keep={},fa=document.activeElement&&document.activeElement.id;
  document.querySelectorAll("#view input[id],#view select[id]").forEach(el=>keep[el.id]=el.value);
  draw();
  for(const id in keep){const el=document.getElementById(id);if(el&&!el.value&&keep[id])el.value=keep[id]}
  if(fa&&/^(st_|ex_|h_)/.test(fa)){const el=document.getElementById(fa);if(el)el.focus({preventScroll:true})}
}
function syncChips(){
  const cb=document.getElementById("chips");
  if(cb.children.length!=9)cb.innerHTML=[...Array(9).keys()].map(i=>{const d=D(i);return `<button class="dc" data-go="${i}"><small>${d.getMonth()+1}/${d.getDate()}</small><b>D${i+1}</b></button>`}).join("");
  [...cb.children].forEach((b,i)=>b.classList.toggle("on",i==cur));
  const on=cb.children[cur];if(on&&lastSync!==cur){lastSync=cur;cb.scrollTo({left:on.offsetLeft-cb.clientWidth/2+on.clientWidth/2,behavior:"smooth"})}
}
function stagger(){document.querySelectorAll("#view .dh,#view .card,#view .ti").forEach((el,i)=>el.style.animationDelay=Math.min(i,9)*55+"ms")}
function go(i){
  if(i==cur)return;
  cur=i;if(i>=0)last=i;location.hash=i<0?"":"d"+(i+1);
  const v=document.getElementById("view");clearTimeout(sw);v.classList.add("out");syncChips();
  sw=setTimeout(()=>{render();scrollTo(0,0);v.classList.add("enter");stagger();requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.remove("out")));setTimeout(()=>v.classList.remove("enter"),1100)},170);
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",9000)}
const val=id=>document.getElementById(id).value;
const needName=()=>!(MEM[ME]&&MEM[ME].name);
function showLogin(){
  document.getElementById("lgl").hidden=true;document.getElementById("lgform").hidden=false;
  const i=document.getElementById("gn");i.value=(MEM[ME]&&MEM[ME].name)||localStorage.getItem("tokyoName")||"";
  document.getElementById("login").classList.remove("gone");setTimeout(()=>i.focus(),500);
}
function enterApp(){SHOWN=1;startWeather();document.getElementById("login").classList.add("gone");document.getElementById("app").classList.add("show")}
function route(){if(SHOWN||!READY)return;needName()?showLogin():enterApp()}
async function saveName(){
  const n=val("gn").trim().slice(0,12);if(!n)return;
  MEM[ME]={name:n};try{localStorage.setItem("tokyoName",n)}catch(e){}
  READY=1;enterApp();render();
  if(LIVE)try{await db.doc("members/"+ME).set({name:n})}catch(e){}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-u],[data-ds],[data-de],[data-dh],[data-pv],[data-cl],[data-wx],#addS,#addE,#addH,#gok,#me");if(!t)return;
  if(t.id=="gok")return saveName();
  if(t.id=="me")return showLogin();
  if(t.dataset.wx!==undefined){startWeather(true);return}
  if(t.dataset.pv!==undefined){PV=t.dataset.pv;return render()}
  if(t.dataset.cl!==undefined){
    const[a,b]=t.dataset.cl.split(":"),i=+b;
    if(a=="ask"){
      if(CONF==i){const r=topSpender(i);S.closed[i]={by:ME,at:Date.now(),rank:r,tot:dayTot(i)};CONF=-1;save();if(r[0])toast(`🏆 Day ${i+1} 提前結算：${nm(r[0][0])} 花費最高 ${yen(r[0][1])}`)}
      else{CONF=i;clearTimeout(cf);cf=setTimeout(()=>{CONF=-1;render()},4000)}
    }else if(a=="open"){delete S.closed[i];save()}
    return render();
  }
  if(t.dataset.go!==undefined){e.preventDefault();return go(+t.dataset.go)}
  if(t.dataset.u!==undefined){
    if(cur<0)cur=last;addOpen=addOpen?0:1;addAnim=addOpen;render();
    if(addOpen)setTimeout(()=>{const c=document.getElementById("addcard");if(c){c.scrollIntoView({behavior:"smooth",block:"center"});document.getElementById("st_n").focus({preventScroll:true})}},60);return;
  }
  if(t.dataset.ds!==undefined)delDoc("stops",t.dataset.ds);
  else if(t.dataset.de!==undefined)delDoc("exp",t.dataset.de);
  else if(t.dataset.dh!==undefined){S.hotels.splice(+t.dataset.dh,1);save()}
  else if(t.id=="addS"){
    let n=val("st_n").trim(),gs=val("st_g").trim();
    if(isUrl(n)){if(!gs)document.getElementById("st_g").value=gs=n;document.getElementById("st_n").value=n=urlName(n);if(!n){toast("已讀到網址，請在「地點」欄輸入這個地方的名稱。");return}}
    if(!n)return;
    const sp=SP.find(x=>x.name.toLowerCase()==n.toLowerCase()),c=val("st_c");let g=null;
    if(gs){g=parseCoord(gs);if(!g){toast(isShort(gs)?"這是 Google 地圖短網址，讀不到座標。請用瀏覽器開啟短網址後，複製網址列的完整網址；或在地圖長按地點，貼上顯示的「緯度,經度」。":isUrl(gs)?"這個網址裡找不到座標，請改貼完整的地點網址，或貼「緯度,經度」。":"座標格式不對，請貼「緯度,經度」，例如 35.7148, 139.7967。");return}}
    else g=sp||null;
    const o={t:val("st_t"),name:n,note:val("st_o").trim(),cat:c=="景點"&&sp?sp.cat:c};
    if(g){o.lat=g.lat;o.lng=g.lng}if(sp&&!gs)o.area=sp.area;
    addDoc("stops",o)}
  else if(t.id=="addE"){const a=parseFloat(val("ex_a"));if(!(a>=0))return;
    const f=document.getElementById("ex_f"),o={day:cur,cat:val("ex_c"),label:val("ex_l").trim()||val("ex_c"),amt:a};if(f&&f.value)o.for=f.value;addDoc("exp",o)}
  else if(t.id=="addH"){const n=val("h_n").trim();if(!n||!val("h_ci")||!val("h_co"))return;
    S.hotels.push({name:n,addr:val("h_a").trim(),ci:val("h_ci"),cit:val("h_cit"),co:val("h_co"),cot:val("h_cot"),cost:parseFloat(val("h_p"))||0,cur:val("h_c")});
    S.hotels.sort((a,b)=>a.ci.localeCompare(b.ci));save()}
  render();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id=="rate"){S.rate=parseFloat(t.value)||0.21;save()}
  else if(t.id=="tb"){const b=parseFloat(t.value);if(b>0)S.tb=b;else delete S.tb;save()}
  else if(t.id=="f_a"||t.id=="f_c"){S.flight={amt:parseFloat(val("f_a"))||0,cur:val("f_c")};save()}
  else if(t.dataset.b!==undefined){const b=parseFloat(t.value);if(b>0)S.bud[t.dataset.b]=b;else delete S.bud[t.dataset.b];save()}
  else if(t.dataset.cs!==undefined)updDoc("stops",t.dataset.cs,{cat:t.value});
  else if(t.dataset.ct!==undefined){updDoc("stops",t.dataset.ct,{t:t.value});RP=1;if(document.activeElement!==t){RP=0;render()}return}
  else return;
  render();
});
document.getElementById("gn").addEventListener("keydown",e=>{if(e.key=="Enter")saveName()});
document.addEventListener("securitypolicyviolation",e=>{if(/frame|child/.test(e.violatedDirective)&&PV=="gmap"){GB=1;PV="svg";render()}});
document.addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("tedit")&&RP){RP=0;setTimeout(render,50)}});
function countdown(){
  const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),k=Math.round((t0-START)/864e5);
  document.getElementById("cd").textContent=k<0?`距出發還有 ${-k} 天`:k<=8?`旅途中 · Day ${k+1}`:"旅程已結束";
  return k;
}
const SETL={};for(let i=0;i<9;i++)SETL[i]=settled(i);
setInterval(()=>{for(let i=0;i<9;i++){const s=settled(i);if(s&&!SETL[i]){const r=topSpender(i);if(r.length)toast(`🏆 Day ${i+1} 每日結算：${nm(r[0][0])} 花費最高 ${yen(r[0][1])}`)}if(s!==SETL[i]){SETL[i]=s;render()}}},20000);
function loadLocal(){
  let L=null;try{L=JSON.parse(localStorage.getItem("tokyo")||"null")}catch(e){}if(!L)return;
  Object.assign(S,{rate:L.rate||0.21,tb:L.tb,flight:L.flight,hotels:L.hotels||[],bud:L.bud||{},stops:L.stops||[],exp:L.exp||[],closed:L.closed||{}});
  if(L.days)Object.entries(L.days).forEach(([i,d])=>{if(d.budget)S.bud[i]=d.budget;(d.stops||[]).forEach(s=>S.stops.push(Object.assign({id:uid(),day:+i,by:"local"},s)));(d.exp||[]).forEach(x=>S.exp.push(Object.assign({id:uid(),day:+i,by:"local"},x)))});
}
async function migrate(user){
  try{
    if(!(await user.isOwner()))return;
    if((await db.doc("trip/cfg").get()).exists)return;
    const o=await db.doc("trip/main").get(),L=o.exists&&o.data().json?JSON.parse(o.data().json):{};
    const cfg={rate:L.rate||0.21,tb:L.tb,flight:L.flight,hotels:L.hotels||[],bud:{}};
    Object.entries(L.days||{}).forEach(([i,d])=>{if(d.budget)cfg.bud[i]=d.budget;(d.stops||[]).forEach(s=>addDoc("stops",Object.assign({day:+i},s)));(d.exp||[]).forEach(x=>addDoc("exp",Object.assign({day:+i},x)))});
    await db.doc("trip/cfg").set({json:JSON.stringify(clean(cfg))});
  }catch(e){}
}
document.getElementById("spots").innerHTML=SP.map(x=>`<option value="${esc(x.name)}">${esc(x.area)}</option>`).join("");
const h0=location.hash.match(/^#d([1-9])$/),k0=countdown();
if(h0)cur=+h0[1]-1;else if(k0>=0&&k0<=8)cur=k0;
last=Math.max(cur,0);
render();
setTimeout(()=>{if(!READY){READY=1;route()}},7000);
(async()=>{
  let user=null;
  try{if(window.claude){db=await window.claude.use("db");user=await window.claude.use("user")}}catch(e){}
  let id=null;try{id=user&&db?await user.id():null}catch(e){}
  if(!db||!id){db=null;loadLocal();MEM.local={name:localStorage.getItem("tokyoName")||""};READY=1;route();render();return}
  ME=id;LIVE=1;MEM={};
  await migrate(user);
  db.collection("members").onSnapshot(q=>{MEM={};q.docs.forEach(d=>MEM[d.id]=d.data());READY=1;route();render()},()=>{});
  db.collection("stops").onSnapshot(q=>{S.stops=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
  db.collection("exp").onSnapshot(q=>{S.exp=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
  db.doc("trip/cfg").onSnapshot(s=>{if(s.exists&&!s.metadata.hasPendingWrites){try{const c=JSON.parse(s.data().json);const oc=S.closed||{},nc=c.closed||{};
      if(cfgLoaded)Object.keys(nc).forEach(k=>{if(!oc[k]&&nc[k].rank&&nc[k].rank[0])toast(`🏆 Day ${+k+1} 已提前結算：${nm(nc[k].rank[0][0])} 花費最高 ${yen(nc[k].rank[0][1])}`)});
      cfgLoaded=1;Object.assign(S,{rate:c.rate||0.21,tb:c.tb,flight:c.flight,hotels:c.hotels||[],bud:c.bud||{},closed:nc});render()}catch(e){}}},()=>{});
  render();
})();
</script>
</body>
